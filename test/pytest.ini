# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests requiring database
    unit: marks tests as unit tests

# Logging
log_cli = true
log_cli_level = INFO
log_format = %(levelname)s - %(message)s

# Coverage
addopts = 
    -v
    --tb=short
    --strict-markers